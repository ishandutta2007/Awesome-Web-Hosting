<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="orb-glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-glow-2" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="server-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <style>
      .font-main {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      /* Dynamic background animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }

      @keyframes streamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes signalBeacon {
        0% { r: 3px; opacity: 1; }
        100% { r: 14px; opacity: 0; }
      }

      .floating-orb-1 {
        animation: floatSlow 8s ease-in-out infinite;
      }

      .floating-orb-2 {
        animation: floatSlow 10s ease-in-out infinite reverse;
      }

      .pulse-line {
        stroke-dasharray: 10, 15;
        animation: streamFlow 6s linear infinite;
      }

      .beacon-ring {
        animation: signalBeacon 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: center;
      }

      .status-dot {
        animation: pulseGlow 2s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- 1. Deep Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- 2. Dynamic Ambient Glow Orbs (Strictly In Background) -->
  <circle cx="250" cy="180" r="280" fill="url(#orb-glow-1)" class="floating-orb-1" />
  <circle cx="950" cy="200" r="300" fill="url(#orb-glow-2)" class="floating-orb-2" />

  <!-- 3. Geometric Server & Infrastructure Grid Pattern -->
  <rect width="1200" height="420" rx="16" fill="url(#server-grid)" />

  <!-- 4. Subtle Animated Network Infrastructure Streams (Background) -->
  <g opacity="0.45">
    <path d="M 50 120 C 300 80, 450 200, 650 150 C 850 100, 950 250, 1150 180" 
          fill="none" stroke="#38bdf8" stroke-width="1.8" class="pulse-line" />
    <path d="M 80 320 C 250 360, 500 240, 750 310 C 920 360, 1020 280, 1120 330" 
          fill="none" stroke="#818cf8" stroke-width="1.5" class="pulse-line" style="animation-duration: 9s;" />
  </g>

  <!-- Dynamic Server Rack Node Indicators (Flanking Sides - Away from Center Title) -->
  <g transform="translate(70, 70)" opacity="0.85">
    <!-- Server Node 1 -->
    <rect width="70" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <path d="M 20 28 L 50 28 M 20 38 L 50 38 M 20 48 L 40 48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="52" cy="48" r="3" fill="#10b981" class="status-dot" />
    <!-- Beacon Ping -->
    <circle cx="52" cy="48" r="3" fill="none" stroke="#10b981" stroke-width="1.5" class="beacon-ring" />
  </g>

  <g transform="translate(1060, 270)" opacity="0.85">
    <!-- Server Node 2 -->
    <rect width="70" height="70" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="8 4" />
    <circle cx="35" cy="35" r="5" fill="#38bdf8" class="status-dot" />
    <circle cx="35" cy="35" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon-ring" style="animation-delay: 1.2s;" />
  </g>

  <!-- Outer Border with Sleek Neon Accents -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />
  <path d="M 400 1 L 800 1" stroke="url(#primary-glow)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-blur)" />
  <path d="M 500 419 L 700 419" stroke="url(#primary-glow)" stroke-width="2" stroke-linecap="round" />

  <!-- 5. FOREGROUND: High Visibility Category Capsule -->
  <g transform="translate(485, 45)">
    <rect width="230" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#10b981" class="status-dot" />
    <text x="35" y="22" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.5" class="font-main">CURATED ECOSYSTEM</text>
  </g>

  <!-- 6. FOREGROUND: Main Title (Crisp, High Contrast, Guaranteed Foreground) -->
  <g id="header-text">
    <text x="600" y="150" 
          text-anchor="middle" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="url(#primary-glow)" 
          class="font-main"
          filter="drop-shadow(0 4px 16px rgba(0,0,0,0.8))">
      AWESOME WEB HOSTING
    </text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text x="600" y="200" 
          text-anchor="middle" 
          font-size="18" 
          font-weight="500" 
          fill="#94a3b8" 
          letter-spacing="0.4" 
          class="font-main">
      The Ultimate Guide to Modern Cloud PaaS, Edge Networks &amp; Self-Hosted Hosting Stacks
    </text>
  </g>

  <!-- 7. FOREGROUND: Feature Badges / Highlights (Anchored at the Bottom) -->
  <g transform="translate(120, 260)">
    <!-- Pill 1: Cloud PaaS -->
    <g transform="translate(0, 0)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="34" font-size="18">☁️</text>
      <text x="54" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="font-main">Cloud PaaS</text>
      <text x="54" y="52" fill="#94a3b8" font-size="12" class="font-main">Vercel, Render, Heroku</text>
    </g>

    <!-- Pill 2: Edge Deployments -->
    <g transform="translate(250, 0)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="34" font-size="18">⚡</text>
      <text x="54" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="font-main">Edge Hosting</text>
      <text x="54" y="52" fill="#94a3b8" font-size="12" class="font-main">Cloudflare Pages, Fly.io</text>
    </g>

    <!-- Pill 3: Self-Hosted PaaS -->
    <g transform="translate(500, 0)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="34" font-size="18">🛡️</text>
      <text x="54" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="font-main">Self-Hosted PaaS</text>
      <text x="54" y="52" fill="#94a3b8" font-size="12" class="font-main">Coolify, Dokploy, Dokku</text>
    </g>

    <!-- Pill 4: Control Panels -->
    <g transform="translate(750, 0)">
      <rect width="210" height="74" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
      <text x="24" y="34" font-size="18">🎛️</text>
      <text x="54" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="font-main">Server Panels</text>
      <text x="54" y="52" fill="#94a3b8" font-size="12" class="font-main">1Panel, CyberPanel, Caddy</text>
    </g>
  </g>

  <!-- 8. Subtle footer ticker line inside the banner -->
  <g transform="translate(0, 385)">
    <text x="600" y="0" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600" letter-spacing="1" class="font-main">
      OPEN SOURCE • SELF-HOSTED • ZERO VENDOR LOCK-IN • ENTERPRISE SAAS
    </text>
  </g>
</svg>
